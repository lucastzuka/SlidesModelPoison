<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Model Poisoning</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,100..900,100,0;1,9..144,100..900,100,0&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet" />
  <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }
#grid-bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; background-image: linear-gradient(to right, rgba(0,0,0,.07) 1px, transparent 1px), linear-gradient(to bottom, rgba(0,0,0,.07) 1px, transparent 1px); background-size: 60px 60px; }
#stage { position: fixed; inset: 0; z-index: 1; }
.slide { position: absolute; inset: 0; transition: transform 0.6s cubic-bezier(0.77, 0, 0.175, 1); pointer-events: none; will-change: transform; }
.slide.active { transform: translateY(0); pointer-events: auto; }
.slide.before { transform: translateY(-100vh); }
.slide.after { transform: translateY(100vh); }
.slide-inner { position: absolute; transform-origin: top left; }
.anim { will-change: transform; backface-visibility: hidden; }
.slide:not(.active) .anim { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) { .anim { animation: none !important; } }

@keyframes a-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
@keyframes a-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
@keyframes a-sway { 0%, 100% { transform: rotate(-2.2deg); } 50% { transform: rotate(2.2deg); } }
@keyframes a-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes a-pulse { 0%, 60%, 100% { transform: scale(1); } 30% { transform: scale(1.07); } }
@keyframes a-drift { 0%, 100% { transform: translateY(0) rotate(-1.5deg); } 50% { transform: translateY(-12px) rotate(1.5deg); } }
@keyframes a-shiver { 0%, 100% { transform: translate(0,0) rotate(0deg); } 92% { transform: translate(0,0) rotate(0deg); } 94% { transform: translate(-2px,1px) rotate(-1deg); } 96% { transform: translate(2px,-1px) rotate(1deg); } 98% { transform: translate(-1px,1px) rotate(-0.6deg); } }
@keyframes a-glide { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(14px); } }
@keyframes a-wobble { 0%, 100% { transform: rotate(0deg) scale(1); } 25% { transform: rotate(2deg) scale(1.02); } 75% { transform: rotate(-2deg) scale(1.02); } }
@keyframes a-bob { 0%, 100% { transform: translateY(6px) scale(0.98); } 50% { transform: translateY(-10px) scale(1.05); } }
@keyframes a-drop { 0%, 100% { transform: translateY(-12px); } 55% { transform: translateY(12px); } }

.anim-float { animation: a-float 5s ease-in-out infinite; }
.anim-breathe { animation: a-breathe 4.5s ease-in-out infinite; }
.anim-sway { animation: a-sway 5.5s ease-in-out infinite; }
.anim-spin { animation: a-spin 24s linear infinite; }
.anim-pulse { animation: a-pulse 3.2s ease-in-out infinite; }
.anim-drift { animation: a-drift 6s ease-in-out infinite; }
.anim-shiver { animation: a-shiver 4s ease-in-out infinite; }
.anim-glide { animation: a-glide 6s ease-in-out infinite; }
.anim-wobble { animation: a-wobble 5s ease-in-out infinite; }
.anim-bob { animation: a-bob 4.5s ease-in-out infinite; }
.anim-drop { animation: a-drop 2.8s ease-in-out infinite; }

.bullet { color: var(--bullet, currentColor); }

a.ref { color: var(--accent, #444444) !important; text-decoration: underline !important; text-decoration-style: solid !important; text-decoration-thickness: 2px !important; text-underline-offset: 3px !important; cursor: pointer; transition: text-shadow 0.22s ease, -webkit-text-stroke 0.22s ease !important; }
a.ref:hover { -webkit-text-stroke: 0.28px currentColor !important; text-shadow: 0 0 14px color-mix(in srgb, currentColor 38%, transparent) !important; text-decoration-thickness: 2px !important; }
.tx-link { color: var(--accent, #444444) !important; text-decoration: underline solid; text-decoration-thickness: 2px; text-underline-offset: 5px; cursor: pointer; transition: text-shadow 0.22s ease, -webkit-text-stroke 0.22s ease; }
.tx-link:hover { font-weight: 800 !important; -webkit-text-stroke: 0.22px currentColor; text-shadow: 0 0 16px color-mix(in srgb, currentColor 36%, transparent); text-decoration-thickness: 2px !important; }

img[data-href] { cursor: pointer; transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.35s ease; }
img[data-href]:hover { transform: scale(1.03); filter: drop-shadow(0 0 10px color-mix(in srgb, var(--accent, #444) 22%, transparent)); }

.popup-balloon { position: fixed; background: white; border-radius: 16px; padding: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); z-index: 1000; max-width: 480px; animation: popupAppear 0.22s cubic-bezier(0.34, 1.56, 0.64, 1); }
.popup-balloon img { width: 100%; height: auto; border-radius: 12px; display: block; }
@keyframes popupAppear { from { opacity: 0; transform: scale(0.8) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.popup-text-balloon { position: fixed; background: white; border-radius: 16px; padding: 16px 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); z-index: 1000; max-width: 380px; font-family: 'Nunito', sans-serif; font-size: 15px; line-height: 1.62; color: #1a1a1a; animation: popupAppear 0.22s cubic-bezier(0.34, 1.56, 0.64, 1); }
.popup-text-balloon b { font-weight: 900; }
.popup-text-balloon em { font-style: italic; font-weight: 700; }

@keyframes tremble { 0%, 100% { transform: translate(0, 0); } 20% { transform: translate(-2px, -2px); } 40% { transform: translate(2px, 2px); } 60% { transform: translate(-2px, 2px); } 80% { transform: translate(2px, -2px); } }
.tremble { animation: tremble 0.3s infinite; }

#counter { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 200; user-select: none; display: flex; flex-direction: column; align-items: center; }
#counter-label { font: 13px/1 monospace; color: rgba(0,0,0,.45); letter-spacing: 2px; cursor: pointer; padding: 7px 14px; border-radius: 999px; background: rgba(255,255,255,.72); border: 1px solid rgba(0,0,0,.08); backdrop-filter: blur(4px); transition: color .2s, background .2s, box-shadow .2s; }
#counter:hover #counter-label { color: #000; background: #fff; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
#index-popup { position: absolute; bottom: calc(100% + 12px); left: 50%; transform: translateX(-50%) translateY(10px); opacity: 0; pointer-events: none; transition: opacity .22s ease, transform .22s ease; background: #fffdf7; border: 1px solid rgba(0,0,0,.1); border-radius: 20px; box-shadow: 0 20px 56px rgba(0,0,0,.29); padding: 16px 16px 14px; width: 540px; max-width: 92vw; }
#index-popup::after { content: ''; position: absolute; top: 100%; left: 0; right: 0; height: 18px; }
#counter:hover #index-popup { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
#index-head { font-family: 'Fraunces', serif; font-style: italic; font-weight: 700; font-size: 20px; color: #000; padding: 0 8px 10px; margin-bottom: 6px; }
#index-inner { display: grid; grid-template-columns: 1fr 1fr; grid-auto-flow: column; gap: 1px 12px; max-height: 56vh; overflow-y: auto; scrollbar-width: thin; }
.index-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: none; background: transparent; border-radius: 10px; cursor: pointer; text-align: left; width: 100%; font-family: 'Nunito', sans-serif; transition: background .14s; }
.index-item:hover { background: #fff2ce; }
.index-item.active { background: #ffd24a; }
.index-num { font: 700 12px/1 monospace; color: rgba(0,0,0,.4); min-width: 22px; flex-shrink: 0; }
.index-item.active .index-num { color: #000; }
.index-title { font-size: 14.5px; font-weight: 600; color: #2d2d2d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.index-item.active .index-title { color: #000; }
  </style>
</head>
<body>
  <div id="grid-bg"></div>
  <div id="stage"></div>
  <div id="counter"></div>
  <script src="slides-data.js"></script>
  <script src="renderer.js"></script>
</body>
</html>

<style id="__om-edit-overrides">
#stage :is(img,video) { border: none !important; padding: 0px !important; margin: 0px !important }
</style>
